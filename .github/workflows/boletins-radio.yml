name: Boletins de rádio do O Olho

on:
  schedule:
    - cron: "1 9,15,22 * * *"   # 06h01, 12h01 e 19h01 em Fortaleza
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boletins-radio
  cancel-in-progress: false

jobs:
  boletins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ffmpeg e dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -r scripts/requirements.txt

      - name: Gravar, transcrever e classificar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODELO: ${{ vars.MODELO }}
          MODELO_TRANSCRICAO: ${{ vars.MODELO_TRANSCRICAO }}
          RADIOS_DURACAO: ${{ vars.RADIOS_DURACAO }}
        run: python scripts/radios.py

      - name: Publicar os boletins no painel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radios.json data/boletins.json data/candidatos.json
          if git diff --cached --quiet; then
            echo "Nada novo para publicar"
          else
            git commit -m "Boletins de rádio $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
